repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format
  # Runs mypy from the dev environment (requirements_dev.txt) so Home Assistant types are available.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy custom_components tests
        language: system
        types: [python]
        pass_filenames: false
