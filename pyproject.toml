[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "homeassistant.*",
  "voluptuous"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
