version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned by pytest-homeassistant-custom-component; bump that package instead.
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
      - dependency-name: cryptography
