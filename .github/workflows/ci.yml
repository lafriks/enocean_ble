name: CI

on:
  push:
    branches: [main, dev]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy custom_components tests

      - name: Pytest
        run: pytest

      - name: Manifest sanity
        run: python scripts/check_manifest.py

      - name: Release tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import json; print(json.load(open('custom_components/enocean_ble/manifest.json'))['version'])")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
